# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "config"]

[processor.pylint]
src_dirs = ["src", "config"]

[processor.mypy]
src_dirs = ["src", "config"]
batch = false
args = ["--ignore-missing-imports"]

[processor.requirements]
src_dirs = ["src", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["src", "config"]
args = ["--severity=error", "--shell=bash"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

[processor.eslint]
src_dirs = ["config"]
args = ["-c", "config/eslint.config.js"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# README.md is kept as a static committed file rather than rendered from a
# template: this repo's pydmt README carried PyPI/codacy/contact sections
# that the shared demo template does not model, so freezing it preserves the
# published content exactly.
[dependencies]
pip = [
    "dnslib",
    "flask",
    "flask-limiter",
    "gevent",
    "mysql-connector-python",
    "pyslowloris",
    "requests",
    "scapy",
    "yattag",
]
