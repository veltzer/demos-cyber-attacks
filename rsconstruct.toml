# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.markdown]

[analyzer.python]

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "config"]

[processor.pylint]
src_dirs = ["src", "config"]

[processor.mypy]
src_dirs = ["src", "config"]
batch = false
args = ["--ignore-missing-imports"]

[processor.requirements]
src_dirs = ["src", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["src", "config"]
args = ["--severity=error", "--shell=bash"]

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# README.md is kept as a static committed file rather than rendered from a
# template: this repo's pydmt README carried PyPI/codacy/contact sections
# that the shared demo template does not model, so freezing it preserves the
# published content exactly.
[dependencies]
pip = [
    "dnslib",
    "flask",
    "flask-limiter",
    "gevent",
    "mysql-connector-python",
    "pyslowloris",
    "requests",
    "scapy",
    "yattag",
]
