# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.markdown]

[analyzer.python]

[processor.checker.rumdl]
src_dirs = ["src"]
src_files = ["README.md"]

[processor.checker.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["src"]


[processor.checker.pyrefly]
src_dirs = ["src"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.ishellcheck]
src_dirs = ["src"]
# external_sources lets ishellcheck follow the tracked .env that connect.sh
# and open_app.sh source, so their variables are seen as assigned.
external_sources = true

[processor.checker.taplo]
src_files = [".ruff.toml", ".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

[processor.checker.itidy]
src_dirs = ["src"]

# README.md is kept as a static committed file rather than rendered from a
# template: this repo's pydmt README carried PyPI/codacy/contact sections
# that the shared demo template does not model, so freezing it preserves the
# published content exactly.

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The auditor persona, zizmor's strictest: everything the pedantic one
# reports (undocumented permissions, template expansion of any context,
# unnamed jobs, ...) plus the findings that need a person to judge them.
# --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=auditor"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_files = [".hadolint.yaml", ".yamllint.yaml"]
src_dirs = [".github", "src"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.checker.idockerfile]
src_dirs = ["src"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

# every .c file is a standalone program with its own main: one run per file
[processor.checker.cppcheck]
src_dirs = ["src"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]

# lint the Lua configuration with luacheck (policy: .luacheckrc)
[processor.checker.iluacheck]
src_dirs = ["config"]

# every lint suppression names a rule and says why (see the fleet's CLAUDE.md)
[processor.checker.suppressions]
src_dirs = [".github", "config", "src"]
src_files = [".hadolint.yaml", ".yamllint.yaml", "README.md"]
