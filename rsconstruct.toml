# rsconstruct build configuration for this repository.

[analyzer.markdown]

[analyzer.python]

[processor.rumdl]
src_dirs = ["src"]
src_files = ["README.md"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src"]

[processor.pylint]
src_dirs = ["src"]

[processor.mypy]
src_dirs = ["src"]
batch = false
# mypy writes a shared SQLite metadata cache (.mypy_cache). With batch = false
# rsconstruct invokes mypy once per file, and running those in parallel makes
# the processes collide on the cache DB ("database is locked" at
# PRAGMA journal_mode=WAL). Serialize just this processor so the per-file
# invocations never write the cache concurrently; every other processor keeps
# full parallelism.
max_jobs = 1
args = ["--ignore-missing-imports", "--show-traceback"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["src"]
# --external-sources lets shellcheck follow the tracked .env that connect.sh
# and open_app.sh source, so their variables are seen as assigned.
args = ["--external-sources"]

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# README.md is kept as a static committed file rather than rendered from a
# template: this repo's pydmt README carried PyPI/codacy/contact sections
# that the shared demo template does not model, so freezing it preserves the
# published content exactly.

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.yamllint]
src_dirs = ["src"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.hadolint]
src_dirs = ["src"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.ijsonlint]
src_files = ["package.json"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.cppcheck]
src_dirs = ["src"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]
